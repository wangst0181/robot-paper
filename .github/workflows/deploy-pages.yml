name: Deploy research pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download public paper PDFs
        run: |
          mkdir -p topics/01-human-video-to-robot/sources
          curl --fail --location --retry 3 \
            https://arxiv.org/pdf/2504.12609 \
            --output topics/01-human-video-to-robot/sources/Human2Sim2Robot.pdf
          curl --fail --location --retry 3 \
            https://arxiv.org/pdf/2606.08828 \
            --output topics/01-human-video-to-robot/sources/Video2Sim2Real.pdf

      - name: Validate site structure and links
        run: python3 scripts/validate_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
